<svg xmlns='http://www.w3.org/2000/svg' width='900' height='460' viewBox='0 0 900 460'><rect width='900' height='460' fill='#f3f6fb'/><text x='450' y='34' font-family='Segoe UI' font-size='20' font-weight='600' fill='#0b3b8c' text-anchor='middle'>winupg - fastest by default, zero extra flags</text><rect x='60' y='70' width='150' height='56' rx='8' fill='#ffffff' stroke='#1f6feb' stroke-width='1.5'/><text x='135' y='104.5' font-family='Segoe UI' font-size='13' fill='#0b0b0b' text-anchor='middle'>winupg</text><line x1='210' y1='98' x2='280' y2='98' stroke='#1f6feb' stroke-width='2'/><polygon points='274,95 280,98 274,101' fill='#1f6feb'/><rect x='280' y='66' width='320' height='74' rx='8' fill='#d3f2df' stroke='#0e6b3a' stroke-width='1.5'/><text x='440' y='-22.5' font-family='Segoe UI' font-size='13' fill='#0b0b0b' text-anchor='middle'>DEFAULT: FAST (no flags)</text><text x='440' y='109.5' font-family='Segoe UI' font-size='13' fill='#0b0b0b' text-anchor='middle'>C:\WinSetupCache stage + warm cache</text><text x='440' y='241.5' font-family='Segoe UI' font-size='13' fill='#0b0b0b' text-anchor='middle'>-DisableDynamicUpdate passed to engine</text><line x1='600' y1='103' x2='668' y2='103' stroke='#1f6feb' stroke-width='2'/><polygon points='662,100 668,103 662,106' fill='#1f6feb'/><rect x='668' y='66' width='200' height='74' rx='8' fill='#ffffff' stroke='#0e6b3a' stroke-width='1.5'/><text x='768' y='-22.5' font-family='Segoe UI' font-size='13' fill='#0b0b0b' text-anchor='middle'>setup.exe</text><text x='768' y='109.5' font-family='Segoe UI' font-size='13' fill='#0b0b0b' text-anchor='middle'>/Auto Upgrade /Quiet</text><text x='768' y='241.5' font-family='Segoe UI' font-size='13' fill='#0b0b0b' text-anchor='middle'>/Compat IgnoreWarning</text><line x1='768' y1='140' x2='768' y2='210' stroke='#1f6feb' stroke-width='2'/><polygon points='762,207 768,210 762,213' fill='#1f6feb'/><rect x='568' y='210' width='400' height='56' rx='8' fill='#fff3cd' stroke='#9a6b00' stroke-width='1.5'/><text x='768' y='244.5' font-family='Segoe UI' font-size='13' fill='#0b0b0b' text-anchor='middle'>auto-reboot x2-3  ->  post-boot ReArm + auto-logon (count=3)  ->  desktop-ready.marker</text><line x1='768' y1='266' x2='768' y2='320' stroke='#1f6feb' stroke-width='2'/><polygon points='762,317 768,320 762,323' fill='#1f6feb'/><rect x='618' y='320' width='300' height='56' rx='8' fill='#d3f2df' stroke='#0e6b3a' stroke-width='1.5'/><text x='768' y='354.5' font-family='Segoe UI' font-size='13' fill='#0b0b0b' text-anchor='middle'>Booted to Windows, ready to use`n~35 min best / ~44-47 typical</text><rect x='60' y='220' width='240' height='70' rx='8' fill='#ffe8e8' stroke='#c42b1c' stroke-width='1.5'/><text x='180' y='261.5' font-family='Segoe UI' font-size='13' fill='#0b0b0b' text-anchor='middle'>-Full flag (opt-in)`nDynamicUpdate Enable`n+10-14 min, lands patched</text><line x1='280' y1='103' x2='60' y2='103' stroke='#1f6feb' stroke-width='2'/><polygon points='54,100 60,103 54,106' fill='#1f6feb'/><line x1='180' y1='220' x2='180' y2='160' stroke='#1f6feb' stroke-width='2'/><polygon points='174,157 180,160 174,163' fill='#1f6feb'/></svg>